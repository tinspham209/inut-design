name: Deploy INUT Web

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Owner-approved deployment channel
        required: true
        type: choice
        options:
          - preview
          - production
      deploy:
        description: Perform the selected deployment after all gates pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    env:
      DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
      PREVIEW_SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
      NEXT_PUBLIC_SITE_URL: https://inutdesign.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable exact pnpm version
        run: corepack enable && corepack prepare pnpm@11.5.3 --activate
      - name: Verify exact package manager
        run: test "$(pnpm --version)" = "11.5.3"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run local release gates
        run: pnpm release:local
      - name: Cloudflare deploy dry run
        run: pnpm exec vinext-cloudflare deploy --dry-run
      - name: Create release manifest
        run: pnpm migration:release-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            artifacts/migration/gates/
            artifacts/migration/release/
            artifacts/migration/runtime/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: ${{ inputs.deploy }}
    needs: release-gates
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    env:
      DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
      PREVIEW_SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
      NEXT_PUBLIC_SITE_URL: https://inutdesign.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable exact pnpm version
        run: corepack enable && corepack prepare pnpm@11.5.3 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy approved channel
        run: pnpm deploy:vinext
